ignoreLogs = ["warning-home-page-is-leaf-bundle", "warning-deprecated-path"]

[params]
  author = "ZOE WU"
  description = "Personal academic research portfolio"
  email = "zoewu@umich.edu"
  cv = "/cv/CV-placeholder.pdf"

[markup]
